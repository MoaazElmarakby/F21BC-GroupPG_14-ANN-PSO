# Default experiment. Mirrors the dataclass defaults in src/psoann/config.py
# (a test keeps the two in sync). Decision numbers refer to docs/design.md section 6.
name = "default"
base_seed = 0
n_runs = 10

[data]
path = "data/raw/banknote.csv"
train_fraction = 0.7
standardise = true            # D6
split_policy = "fixed"        # "fixed" | "per_run"

[ann]
hidden_layers = [8]           # D7: 4-8-1
hidden_activation = "tanh"
output_activation = "logistic"
n_outputs = 1

[pso]
swarm_size = 30
iterations = 100              # budget = swarm_size * iterations = 3000 fitness evaluations
alpha = 0.7298                # D3
beta = 1.4962
gamma = 1.4962
delta = 0.0
epsilon = 1.0
informants = "random"         # D4
n_informants = 3
regenerate_informants = false
bound = 2.0                   # D5
bound_handling = "clamp"
initial_velocity = "half_diff"
# max_velocity_fraction = 0.5 # optional velocity clamp (unset = off)

[training]
fitness = "accuracy"          # D2
